services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - wallet-postgres-data:/var/lib/postgresql/data

  migrate:
    build: .
    entrypoint: ["/wallet-migrate"]
    environment:
      DATABASE_URL: postgres://wallet:wallet@postgres:5432/wallet?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    environment:
      APP_ENV: development
      HTTP_ADDRESS: :8080
      DATABASE_URL: postgres://wallet:wallet@postgres:5432/wallet?sslmode=disable
      DATABASE_MAX_CONNECTIONS: 20
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  wallet-postgres-data:
